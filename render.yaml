services:
  - type: web
    name: aerosense-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WAQI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
